<!-- INFO: Settings page -->
<div id="panel_home" class="panel tw_list">
  <div class="header">NextWheel: {{title}} </div>
  <div style="padding: 10px 0px;"></div>

  <!-- INFO: Change language -->
  <div id="lang_page_toggle" class="small_card dimc card_animation" style="margin-top: 15px;">
    <div class="dimc" style="display: inline-block;">
      <div class="dimc content" style="font-size: 1.1em; padding-left: 5px; padding-top: 6px; padding-bottom: 2px;">
        {{language.title}}
      </div>
      <div class="dimc desc" style="font-size: 0.9em; padding-left: 5px; padding-bottom: 6px;">
        {{language.description}}
      </div>
    </div>
  </div>

  <div class="small_card dimc" style="margin-top: 15px;">
    <div class="action_card">
      <div class="dimc content action_card_title">
        {{fullscreen.title}}
      </div>
      <div class="dimc desc action_card_description">
        {{fullscreen.description}}
      </div>
    </div>

    <label class="switch dimc">
      <input id="tw_webui_fullscreen_switch" type="checkbox">
      <span class="slider"></span>
    </label>
  </div>

  <!-- INFO: Credit card. Elements with credit-link open that page when tapped. -->
  <div class="dim card" style="margin-top: 15px;">
    <div class="dimc content">
      <div id="mcre_title" class="dimc" style="font-size: 1.1em">{{moduleDevelopers}}</div>
      <div id="credit_ifoknr" credit-link="https://github.com/ifoknr" class="dimc desc tw_credit" style="font-size: 0.9em; margin-top: 3px;">
        ifoknr <span class="tw_credit_url">github.com/ifoknr</span>
      </div>
      <div class="dimc desc" style="font-size: 0.9em; margin-top: 3px;">
        {{basedOn}}: <span id="credit_thepedroo" credit-link="https://github.com/ThePedroo" class="tw_credit">ThePedroo</span>, <span id="credit_rainyxeon" credit-link="https://github.com/RainyXeon" class="tw_credit">RainyXeon</span>
      </div>
    </div>

    <div class="dimc" style="margin-top: 15px;">
      <div id="webcre_title" class="dimc" style="font-size: 1.1em">{{WebUIDevelopers}}</div>
      <div class="dimc desc" style="font-size: 0.9em; margin-top: 3px;">
        <span id="credit_ifoknr_webui" credit-link="https://github.com/ifoknr" class="tw_credit">ifoknr</span>, <span id="credit_rainyxeon_webui" credit-link="https://github.com/RainyXeon" class="tw_credit">RainyXeon</span>
      </div>
    </div>
  </div>

  <!-- INFO: License card -->
  <div class="dim card" style="margin-top: 15px;">
    <div class="dimc content">
      <div id="mlic_title" class="dimc" style="font-size: 1.1em">{{moduleLicense}}</div>
      <div class="dimc desc" style="font-size: 0.9em; margin-top: 3px;">AGPLv3</div>
    </div>
  </div>
</div>
