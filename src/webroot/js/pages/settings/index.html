<!-- INFO: Settings page -->
<div id="panel_home" class="panel tw_list">
  <div class="header">NextWheel: {{title}} </div>
  <div style="padding: 10px 0px;"></div>

  <!-- INFO: Change language -->
  <button type="button" id="lang_page_toggle" class="small_card dimc card_animation" style="margin-top: 15px; width: calc(100% - 32px);">
    <div class="dimc" style="display: inline-block;">
      <div class="dimc content" style="font-size: 14.5px; padding-left: 5px; padding-top: 6px; padding-bottom: 2px;">
        {{language.title}}
      </div>
      <div class="dimc desc" style="font-size: 12.5px; padding-left: 5px; padding-bottom: 6px;">
        {{language.description}}
      </div>
    </div>
  </button>

  <!-- INFO: Theme (day/night) selector -->
  <div class="dim card" style="margin-top: 15px;">
    <div class="dimc content action_card_title" style="font-size: 14.5px; padding-bottom: 10px;">
      {{theme.title}}
    </div>
    <div class="tw_seg" id="tw_theme_seg">
      <button type="button" class="tw_seg_btn dimc" data-theme-opt="system">{{theme.system}}</button>
      <button type="button" class="tw_seg_btn dimc" data-theme-opt="dark">{{theme.dark}}</button>
      <button type="button" class="tw_seg_btn dimc" data-theme-opt="light">{{theme.light}}</button>
    </div>
  </div>

  <div class="small_card dimc" style="margin-top: 15px;">
    <div class="action_card">
      <div class="dimc content action_card_title">
        {{fullscreen.title}}
      </div>
      <div class="dimc desc action_card_description">
        {{fullscreen.description}}
      </div>
    </div>

    <label class="switch dimc">
      <input id="tw_webui_fullscreen_switch" type="checkbox">
      <span class="slider"></span>
    </label>
  </div>

  <!-- INFO: Credit card. Elements with credit-link open that page when tapped. -->
  <div class="dim card" style="margin-top: 15px;">
    <div class="dimc content">
      <div id="mcre_title" class="dimc" style="font-size: 14.5px">{{moduleDevelopers}}</div>
      <button type="button" id="credit_ifoknr" credit-link="https://github.com/ifoknr" class="dimc desc tw_credit" style="display: block; font-size: 12.5px; margin-top: 3px;">
        <img class="tw_sig tw_sig_dark" src="assets/ifoknr-dark.svg" alt="IFOKNR"><img class="tw_sig tw_sig_light" src="assets/ifoknr-light.svg" alt="IFOKNR"> <span class="tw_credit_url">github.com/ifoknr</span>
      </button>
      <div class="dimc desc" style="font-size: 12.5px; margin-top: 3px;">
        {{basedOn}}: <button type="button" id="credit_thepedroo" credit-link="https://github.com/ThePedroo" class="tw_credit">ThePedroo</button>, <button type="button" id="credit_rainyxeon" credit-link="https://github.com/RainyXeon" class="tw_credit">RainyXeon</button>
      </div>
    </div>

    <div class="dimc" style="margin-top: 15px;">
      <div id="webcre_title" class="dimc" style="font-size: 14.5px">{{WebUIDevelopers}}</div>
      <div class="dimc desc" style="font-size: 12.5px; margin-top: 3px;">
        <button type="button" id="credit_ifoknr_webui" credit-link="https://github.com/ifoknr" class="tw_credit"><img class="tw_sig tw_sig_dark" src="assets/ifoknr-dark.svg" alt="IFOKNR"><img class="tw_sig tw_sig_light" src="assets/ifoknr-light.svg" alt="IFOKNR"></button>, <button type="button" id="credit_rainyxeon_webui" credit-link="https://github.com/RainyXeon" class="tw_credit">RainyXeon</button>
      </div>
    </div>
  </div>

  <!-- INFO: License card -->
  <div class="dim card" style="margin-top: 15px;">
    <div class="dimc content">
      <div id="mlic_title" class="dimc" style="font-size: 14.5px">{{moduleLicense}}</div>
      <div class="dimc desc" style="font-size: 12.5px; margin-top: 3px;">AGPLv3</div>
    </div>
  </div>
</div>
